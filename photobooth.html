<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>수아네컷</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --accent: #1565ff;
    --accent-dark: #0d47c4;
    --text: #1a1a1a;
    --muted: #888;
    --border: #e3e5e9;
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
      "Malgun Gothic", "맑은 고딕", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }
  header h1 { font-size: 28px; letter-spacing: -0.5px; }
  header p {
    color: var(--muted);
    margin-top: 6px;
    font-size: 14px;
  }
  header.hidden { display: none; }

  .screen {
    width: 100%;
    max-width: 760px;
    background: var(--panel);
    border-radius: var(--radius);
    padding: 28px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    display: none;
  }
  .screen.active { display: block; }

  /* ===== 시작 화면 ===== */
  #screen-start {
    cursor: pointer;
    text-align: center;
    padding: 0;
    background: #ffffff;
    color: var(--text);
    overflow: hidden;
  }
  #screen-start .start-inner {
    min-height: 60vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 40px 24px;
  }
  #screen-start .logo { font-size: 64px; }
  #screen-start h2 {
    font-size: 38px;
    letter-spacing: 2px;
    font-weight: 800;
  }
  #screen-start .tap {
    margin-top: 18px;
    font-size: 18px;
    color: var(--accent);
    font-weight: 600;
    animation: pulse 1.6s ease-in-out infinite;
  }
  #screen-start .hint { font-size: 13px; color: var(--muted); }
  @keyframes pulse {
    0%, 100% { opacity: 0.5; transform: scale(1); }
    50%      { opacity: 1;  transform: scale(1.04); }
  }

  /* ===== 공통 버튼 ===== */
  .btn {
    border: none;
    border-radius: 12px;
    padding: 14px 26px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease;
    font-family: inherit;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-primary:disabled { background: #b8c4dd; cursor: not-allowed; }
  .btn-secondary { background: #eef0f4; color: var(--text); }
  .btn-secondary:hover { background: #e2e5ec; }

  /* ===== 1단계: 선택 화면 ===== */
  .section-title {
    font-size: 18px;
    font-weight: 700;
    margin: 24px 0 14px;
  }
  .section-title:first-child { margin-top: 0; }

  .option-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  .option {
    border: 3px solid transparent;
    border-radius: 12px;
    cursor: pointer;
    overflow: hidden;
    position: relative;
    aspect-ratio: 3 / 4;
    background: #f0f0f0;
    transition: border-color 0.15s ease, transform 0.08s ease;
  }
  .option:active { transform: scale(0.97); }
  .option.selected { border-color: var(--accent); }
  .option .label {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    font-size: 13px;
    text-align: center;
    padding: 6px 0;
  }
  .option .swatch { width: 100%; height: 100%; }
  .option img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  /* 레이아웃 미리보기 (칸 배치 도식) */
  .layout-preview {
    width: 100%; height: 100%;
    background: #eef1f6;
    display: grid;
    gap: 6px;
    padding: 14px;
  }
  .layout-preview.strip { grid-template-columns: 1fr; grid-template-rows: repeat(4, 1fr); }
  .layout-preview.grid  { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); }
  .layout-preview span { background: #aebfe0; border-radius: 3px; }

  .start-row { margin-top: 32px; text-align: center; }

  /* ===== 2단계: 촬영 화면 ===== */
  .camera-wrap {
    position: relative;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    border-radius: 14px;
    overflow: hidden;
    background: #000;
    aspect-ratio: 4 / 3;
  }
  #video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1); /* 거울 모드 */
    display: block;
  }
  .countdown {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 120px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
    pointer-events: none;
  }
  .shot-badge {
    position: absolute;
    top: 14px; left: 14px;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
  }
  .rec-badge {
    position: absolute;
    top: 14px; right: 14px;
    display: none;
    align-items: center;
    gap: 6px;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
  }
  .rec-badge.on { display: flex; }
  .rec-badge .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #ff3b30;
    animation: blink 1s steps(2, start) infinite;
  }
  @keyframes blink { 50% { opacity: 0.2; } }
  .flash {
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
  }
  .flash.fire { animation: flash 0.45s ease-out; }
  @keyframes flash {
    0% { opacity: 0.95; }
    100% { opacity: 0; }
  }

  .camera-status {
    text-align: center;
    color: var(--muted);
    margin: 16px 0;
    font-size: 14px;
    min-height: 20px;
  }
  .camera-status.error { color: #e23; }

  .thumbs {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  .thumbs .slot {
    width: 70px;
    aspect-ratio: 4 / 3;
    border-radius: 8px;
    border: 2px dashed var(--border);
    overflow: hidden;
    background: #fafafa;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ccc;
    font-size: 12px;
  }
  .thumbs .slot img { width: 100%; height: 100%; object-fit: cover; }

  .capture-actions { margin-top: 22px; text-align: center; }

  /* ===== 3단계: 결과 화면 ===== */
  .result-wrap { text-align: center; }
  #resultCanvas {
    max-width: 100%;
    max-height: 70vh;
    border-radius: 8px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.15);
  }
  #resultVideo {
    display: none;
    max-width: 320px;
    width: 100%;
    margin: 18px auto 0;
    border-radius: 10px;
    background: #000;
  }
  .result-actions {
    margin-top: 26px;
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  @media (max-width: 520px) {
    .screen { padding: 18px; }
    .countdown { font-size: 80px; }
    header h1 { font-size: 22px; }
    #screen-start h2 { font-size: 30px; }
  }
</style>
</head>
<body>
  <header id="appHeader">
    <h1>📸 수아네컷</h1>
    <p>프레임과 필터를 고르고, 네 컷을 찍어보세요!</p>
  </header>

  <!-- ============ 시작 화면 ============ -->
  <section id="screen-start" class="screen active">
    <div class="start-inner">
      <div class="logo">📸</div>
      <h2>수아네컷</h2>
      <div class="tap">화면을 눌러 시작하세요</div>
      <div class="hint">웹캠으로 네 컷을 찍고 사진·영상으로 저장해요</div>
    </div>
  </section>

  <!-- ============ 1단계: 프레임 / 레이아웃 선택 ============ -->
  <section id="screen-select" class="screen">
    <h2 class="section-title">1. 프레임 색상 선택</h2>
    <div class="option-grid" id="frameOptions"></div>

    <h2 class="section-title">2. 사진 배치 선택</h2>
    <div class="option-grid" id="layoutOptions"></div>

    <h2 class="section-title">3. 필터 선택</h2>
    <div class="option-grid" id="filterOptions"></div>

    <div class="start-row">
      <button class="btn btn-primary" id="startBtn">촬영 시작</button>
    </div>
  </section>

  <!-- ============ 2단계: 촬영 ============ -->
  <section id="screen-capture" class="screen">
    <div class="camera-wrap">
      <video id="video" autoplay playsinline muted></video>
      <div class="shot-badge" id="shotBadge">1 / 4</div>
      <div class="rec-badge" id="recBadge"><span class="dot"></span>REC</div>
      <div class="countdown" id="countdown"></div>
      <div class="flash" id="flash"></div>
    </div>
    <div class="camera-status" id="cameraStatus">카메라 권한을 허용해 주세요…</div>
    <div class="thumbs" id="thumbs"></div>
    <div class="capture-actions">
      <button class="btn btn-secondary" id="cancelBtn">처음으로</button>
    </div>
  </section>

  <!-- ============ 3단계: 결과 / 다운로드 ============ -->
  <section id="screen-result" class="screen">
    <div class="result-wrap">
      <h2 class="section-title">완성! 🎉</h2>
      <canvas id="resultCanvas"></canvas>
      <video id="resultVideo" controls muted playsinline></video>
      <div class="result-actions">
        <button class="btn btn-primary" id="downloadBtn">사진 다운로드</button>
        <button class="btn btn-primary" id="downloadVideoBtn" disabled>영상 다운로드</button>
        <button class="btn btn-secondary" id="retakeBtn">다시 찍기</button>
      </div>
    </div>
  </section>

<script>
/* ============================================================
   설정값 (이미지 URL / 레이아웃 좌표를 한 곳에서 관리)
   ============================================================ */

// --- 프레임 옵션 (컬러) ---
// 선택한 색이 사진 둘레의 테두리(인생네컷 띠)가 됩니다.
// 나중에 투명 PNG 프레임을 쓰고 싶으면 항목에 url 을 추가하면 됩니다.
const FRAMES = [
  { id: 'white', name: '화이트', color: '#ffffff' },
  { id: 'black', name: '블랙',   color: '#111111' },
  { id: 'pink',  name: '핑크',   color: '#f6a5c0' },
  { id: 'navy',  name: '네이비', color: '#1b2a4a' },
  { id: 'sky',   name: '스카이', color: '#3aa0ff' },
  { id: 'cream', name: '크림',   color: '#f3e6c4' },
];

// --- 필터 옵션 (컬러 / 흑백) ---
const FILTERS = [
  { id: 'color', name: '컬러' },
  { id: 'bw',    name: '흑백' },
];

// --- 촬영 설정 ---
const TOTAL_SHOTS = 4;    // 총 촬영 컷 수
const COUNTDOWN_SEC = 7;  // 각 컷 카운트다운(초)

// --- 결과물(Canvas) 레이아웃 옵션 ---
// 각 컷(cellW × cellH)을 cols × rows 격자로 배치. 단위: px
// 컷은 인생네컷처럼 '세로형(portrait)' 비율(3:4)로 두고,
// 전체 캔버스 크기는 컷 크기 + 여백으로 자동 계산합니다.
//   strip → 좁고 긴 세로 한 줄 4컷 / grid → 2×2 네컷
const LAYOUTS = [
  { id: 'strip', name: '세로 4컷', cols: 1, rows: 4,
    cellW: 450, cellH: 600, padding: 28, gap: 16, bottomSpace: 80 },
  { id: 'grid',  name: '2x2 네컷', cols: 2, rows: 2,
    cellW: 430, cellH: 560, padding: 28, gap: 16, bottomSpace: 80 },
];

// 컷 크기 + 여백으로 캔버스 전체 크기 계산
function canvasSize(layout) {
  const { cols, rows, cellW, cellH, padding, gap, bottomSpace } = layout;
  return {
    width:  padding * 2 + cols * cellW + (cols - 1) * gap,
    height: padding + rows * cellH + (rows - 1) * gap + bottomSpace,
  };
}

// 선택한 레이아웃에 맞춰 4컷의 그리기 좌표(x, y, width, height)를 계산
function computeSlots(layout) {
  const { cols, rows, cellW, cellH, padding, gap } = layout;
  const slots = [];
  for (let i = 0; i < TOTAL_SHOTS; i++) {
    const c = i % cols;             // 열 위치
    const r = Math.floor(i / cols); // 행 위치
    slots.push({
      x: padding + c * (cellW + gap),
      y: padding + r * (cellH + gap),
      width: cellW,
      height: cellH,
    });
  }
  return slots;
}

/* ============================================================
   상태
   ============================================================ */
const state = {
  frameId: FRAMES[0].id,
  layoutId: LAYOUTS[0].id,
  filterId: FILTERS[0].id,
  stream: null,
  photos: [],       // 촬영된 사진 dataURL 배열
  videoUrl: null,   // 녹화 영상 ObjectURL
  videoMime: '',
  cancelled: false  // 촬영 중도 취소 플래그
};

/* ============================================================
   화면 전환
   ============================================================ */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  // 시작 화면에서는 상단 헤더를 숨겨 몰입감을 줌
  document.getElementById('appHeader').classList.toggle('hidden', id === 'screen-start');
  window.scrollTo(0, 0);
}

/* ============================================================
   파일명 타임스탬프
   ============================================================ */
function stamp() {
  const t = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${t.getFullYear()}${p(t.getMonth() + 1)}${p(t.getDate())}_${p(t.getHours())}${p(t.getMinutes())}`;
}

/* ============================================================
   1단계: 옵션 렌더링
   ============================================================ */
function renderOptions() {
  const frWrap = document.getElementById('frameOptions');
  const loWrap = document.getElementById('layoutOptions');
  const fiWrap = document.getElementById('filterOptions');
  frWrap.innerHTML = '';
  loWrap.innerHTML = '';
  fiWrap.innerHTML = '';

  // 프레임 색상 (테두리 색 미리보기)
  FRAMES.forEach(fr => {
    const el = document.createElement('div');
    el.className = 'option' + (fr.id === state.frameId ? ' selected' : '');
    el.innerHTML =
      `<div class="swatch" style="background:${fr.color}"></div>` +
      `<div class="label">${fr.name}</div>`;
    el.onclick = () => { state.frameId = fr.id; renderOptions(); };
    frWrap.appendChild(el);
  });

  // 사진 배치
  LAYOUTS.forEach(lo => {
    const el = document.createElement('div');
    el.className = 'option' + (lo.id === state.layoutId ? ' selected' : '');
    const cells = Array.from({ length: TOTAL_SHOTS }, () => '<span></span>').join('');
    el.innerHTML =
      `<div class="layout-preview ${lo.id}">${cells}</div>` +
      `<div class="label">${lo.name}</div>`;
    el.onclick = () => { state.layoutId = lo.id; renderOptions(); };
    loWrap.appendChild(el);
  });

  // 필터 (컬러 / 흑백) — 샘플 그라데이션에 필터를 적용해 미리보기
  FILTERS.forEach(fi => {
    const el = document.createElement('div');
    el.className = 'option' + (fi.id === state.filterId ? ' selected' : '');
    const css = fi.id === 'bw' ? 'filter:grayscale(1);' : '';
    el.innerHTML =
      `<div class="swatch" style="background:linear-gradient(135deg,#ff8a5b,#3aa0ff);${css}"></div>` +
      `<div class="label">${fi.name}</div>`;
    el.onclick = () => { state.filterId = fi.id; renderOptions(); };
    fiWrap.appendChild(el);
  });
}

/* ============================================================
   2단계: 카메라 + 녹화 + 촬영 플로우
   ============================================================ */
const video = document.getElementById('video');
const countdownEl = document.getElementById('countdown');
const shotBadge = document.getElementById('shotBadge');
const recBadge = document.getElementById('recBadge');
const flashEl = document.getElementById('flash');
const cameraStatus = document.getElementById('cameraStatus');
const thumbsWrap = document.getElementById('thumbs');

function setStatus(msg, isError) {
  cameraStatus.textContent = msg;
  cameraStatus.classList.toggle('error', !!isError);
}

function renderThumbSlots() {
  thumbsWrap.innerHTML = '';
  for (let i = 0; i < TOTAL_SHOTS; i++) {
    const slot = document.createElement('div');
    slot.className = 'slot';
    if (state.photos[i]) {
      slot.innerHTML = `<img src="${state.photos[i]}" alt="컷 ${i + 1}">`;
    } else {
      slot.textContent = i + 1;
    }
    thumbsWrap.appendChild(slot);
  }
}

async function startCamera() {
  setStatus('카메라 권한을 허용해 주세요…');
  try {
    state.stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } },
      audio: true, // 영상에 소리도 함께 녹음
    });
    video.srcObject = state.stream;
    await video.play();
    setStatus('곧 촬영이 시작됩니다!');
    return true;
  } catch (err) {
    // 마이크가 없거나 거부됐을 수 있으니 영상만 다시 시도
    try {
      state.stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } },
        audio: false,
      });
      video.srcObject = state.stream;
      await video.play();
      setStatus('곧 촬영이 시작됩니다!');
      return true;
    } catch (err2) {
      setStatus('⚠️ 카메라를 사용할 수 없습니다. 브라우저 주소창의 카메라 권한을 허용한 뒤 다시 시도해 주세요.', true);
      console.error(err2);
      return false;
    }
  }
}

function stopCamera() {
  if (state.stream) {
    state.stream.getTracks().forEach(t => t.stop());
    state.stream = null;
  }
}

/* --- 영상 녹화 (MediaRecorder) --- */
let mediaRecorder = null;
let recordedChunks = [];

function pickMime() {
  const types = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4'];
  if (typeof MediaRecorder === 'undefined') return null;
  for (const t of types) {
    try { if (MediaRecorder.isTypeSupported(t)) return t; } catch (e) {}
  }
  return '';
}

function startRecording(stream) {
  if (typeof MediaRecorder === 'undefined') return; // 미지원 브라우저
  recordedChunks = [];
  const mime = pickMime();
  try {
    mediaRecorder = mime ? new MediaRecorder(stream, { mimeType: mime })
                         : new MediaRecorder(stream);
  } catch (e) {
    mediaRecorder = null;
    console.warn('녹화를 시작할 수 없습니다.', e);
    return;
  }
  state.videoMime = mediaRecorder.mimeType || mime || 'video/webm';
  mediaRecorder.ondataavailable = e => { if (e.data && e.data.size) recordedChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    if (!recordedChunks.length) return;
    const blob = new Blob(recordedChunks, { type: state.videoMime });
    if (state.videoUrl) URL.revokeObjectURL(state.videoUrl);
    state.videoUrl = URL.createObjectURL(blob);
    const v = document.getElementById('resultVideo');
    v.src = state.videoUrl;
    v.style.display = 'block';
    document.getElementById('downloadVideoBtn').disabled = false;
  };
  mediaRecorder.start();
  recBadge.classList.add('on');
}

function stopRecording() {
  recBadge.classList.remove('on');
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
}

function sleep(ms) {
  return new Promise(res => setTimeout(res, ms));
}

// 현재 비디오 프레임을 캡처해 dataURL 반환 (거울 모드와 동일하게 좌우 반전)
function capturePhoto() {
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  const canvas = document.createElement('canvas');
  canvas.width = vw;
  canvas.height = vh;
  const ctx = canvas.getContext('2d');
  if (state.filterId === 'bw') ctx.filter = 'grayscale(1)'; // 흑백 필터를 사진에 굽기
  ctx.translate(vw, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, vw, vh);
  return canvas.toDataURL('image/png');
}

function fireFlash() {
  flashEl.classList.remove('fire');
  void flashEl.offsetWidth; // reflow 강제 → 애니메이션 재시작
  flashEl.classList.add('fire');
}

async function runCaptureFlow() {
  state.photos = [];
  state.cancelled = false;
  if (state.videoUrl) { URL.revokeObjectURL(state.videoUrl); state.videoUrl = null; }
  document.getElementById('downloadVideoBtn').disabled = true;
  document.getElementById('resultVideo').style.display = 'none';
  renderThumbSlots();

  const ok = await startCamera();
  if (!ok || state.cancelled) return;

  // 라이브 미리보기에도 필터 적용 (WYSIWYG)
  video.style.filter = state.filterId === 'bw' ? 'grayscale(1)' : 'none';

  startRecording(state.stream); // 촬영 시작과 함께 영상 녹화
  await sleep(800);

  for (let shot = 0; shot < TOTAL_SHOTS; shot++) {
    if (state.cancelled) return;
    shotBadge.textContent = `${shot + 1} / ${TOTAL_SHOTS}`;
    setStatus(`${shot + 1}번째 컷을 준비하세요!`);

    // 카운트다운
    for (let t = COUNTDOWN_SEC; t > 0; t--) {
      if (state.cancelled) return;
      countdownEl.textContent = t;
      await sleep(1000);
    }
    countdownEl.textContent = '';
    if (state.cancelled) return;

    // 찰칵!
    fireFlash();
    state.photos.push(capturePhoto());
    renderThumbSlots();
    setStatus('찰칵! 📸');
    await sleep(700);
  }

  setStatus('촬영 완료! 결과를 만드는 중…');
  stopRecording();
  stopCamera();
  await sleep(400);
  await buildResult();
  showScreen('screen-result');
}

/* ============================================================
   3단계: Canvas 합성 + 다운로드
   ============================================================ */
const resultCanvas = document.getElementById('resultCanvas');

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous'; // 외부 URL 이미지 대비
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

// object-fit: cover 방식으로 slot 에 꽉 채워 그리기 (가운데 크롭)
function drawImageCover(ctx, img, x, y, w, h) {
  const ir = img.width / img.height;
  const sr = w / h;
  let sx, sy, sw, sh;
  if (ir > sr) {        // 이미지가 더 넓음 → 좌우 크롭
    sh = img.height;
    sw = sh * sr;
    sx = (img.width - sw) / 2;
    sy = 0;
  } else {              // 이미지가 더 높음 → 상하 크롭
    sw = img.width;
    sh = sw / sr;
    sx = 0;
    sy = (img.height - sh) / 2;
  }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}

// 색의 밝기(0~255)를 계산해 텍스트를 흰/검 중 무엇으로 올릴지 결정
function luminance(hex) {
  const c = hex.replace('#', '');
  const r = parseInt(c.substr(0, 2), 16);
  const g = parseInt(c.substr(2, 2), 16);
  const b = parseInt(c.substr(4, 2), 16);
  return 0.299 * r + 0.587 * g + 0.114 * b;
}

async function buildResult() {
  const layout = LAYOUTS.find(l => l.id === state.layoutId);
  const frame = FRAMES.find(f => f.id === state.frameId);

  // 실제 촬영된 사진의 비율(카메라 비율)에 맞춰 컷 높이를 계산 → 잘림 없이 전체가 들어감
  let cellH = layout.cellH;
  if (state.photos.length) {
    try {
      const first = await loadImage(state.photos[0]);
      cellH = Math.round(layout.cellW * first.height / first.width);
    } catch (e) {}
  }
  const drawLayout = { ...layout, cellH };

  const { width, height } = canvasSize(drawLayout);
  resultCanvas.width = width;
  resultCanvas.height = height;
  const ctx = resultCanvas.getContext('2d');

  const slots = computeSlots(drawLayout);

  // 1) 프레임 색으로 전체를 채움 → 사진 둘레 테두리(인생네컷 띠)가 됨
  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = frame.color;
  ctx.fillRect(0, 0, width, height);

  // 2) 4컷 사진 (필터는 촬영 시 이미 적용됨)
  for (let i = 0; i < state.photos.length; i++) {
    const slot = slots[i];
    try {
      const img = await loadImage(state.photos[i]);
      drawImageCover(ctx, img, slot.x, slot.y, slot.width, slot.height);
    } catch (e) {
      console.error('사진 로드 실패', e);
    }
  }

  // 3) 하단 워터마크 (테두리 색에 맞춰 글자색 자동 선택)
  ctx.fillStyle = luminance(frame.color) > 150 ? '#555' : 'rgba(255,255,255,0.85)';
  ctx.font = '600 24px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  const t = new Date();
  const dateStr = `${t.getFullYear()}.${String(t.getMonth() + 1).padStart(2, '0')}.${String(t.getDate()).padStart(2, '0')}`;
  ctx.fillText('수아네컷  ·  ' + dateStr, width / 2, height - 38);
}

function downloadResult() {
  const link = document.createElement('a');
  link.download = `수아네컷_${stamp()}.png`;
  link.href = resultCanvas.toDataURL('image/png');
  link.click();
}

function downloadVideo() {
  if (!state.videoUrl) return;
  const ext = (state.videoMime || '').includes('mp4') ? 'mp4' : 'webm';
  const link = document.createElement('a');
  link.download = `수아네컷_${stamp()}.${ext}`;
  link.href = state.videoUrl;
  link.click();
}

/* ============================================================
   이벤트 바인딩
   ============================================================ */
document.getElementById('screen-start').onclick = () => {
  showScreen('screen-select');
};

document.getElementById('startBtn').onclick = () => {
  showScreen('screen-capture');
  renderThumbSlots();
  runCaptureFlow();
};

document.getElementById('cancelBtn').onclick = () => {
  state.cancelled = true;
  stopRecording();
  stopCamera();
  showScreen('screen-select');
};

document.getElementById('downloadBtn').onclick = downloadResult;
document.getElementById('downloadVideoBtn').onclick = downloadVideo;

document.getElementById('retakeBtn').onclick = () => {
  state.photos = [];
  showScreen('screen-select');
};

// 초기 렌더
renderOptions();
renderThumbSlots();
showScreen('screen-start');
</script>
</body>
